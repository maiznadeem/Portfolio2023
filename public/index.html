<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <!-- Fetch the fonts and the hero background before the CSS asks for them: avoids a late font swap (layout shift) and speeds up the first paint. -->
    <link rel="preload" href="%PUBLIC_URL%/fonts/CentraNo2-Book.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="%PUBLIC_URL%/fonts/CentraNo2-Medium.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="%PUBLIC_URL%/fonts/CentraNo2-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="%PUBLIC_URL%/hero-bg.webp" as="image" type="image/webp" fetchpriority="high" />
    <style>
      @font-face { font-family: Centra; src: url('%PUBLIC_URL%/fonts/CentraNo2-Book.woff2') format('woff2'); font-weight: 400; font-display: swap; }
      @font-face { font-family: Centra; src: url('%PUBLIC_URL%/fonts/CentraNo2-Medium.woff2') format('woff2'); font-weight: 500; font-display: swap; }
      @font-face { font-family: Centra; src: url('%PUBLIC_URL%/fonts/CentraNo2-Bold.woff2') format('woff2'); font-weight: 700; font-display: swap; }
      .banner { background-image: url('%PUBLIC_URL%/hero-bg.webp'); }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#121214" />
    <meta
      name="description"
      content="Maiz Nadeem, software developer and video editor. Web, mobile and desktop projects with screenshots and source code."
    />
    <meta property="og:title" content="Maiz | Software developer">
    <meta property="og:description" content="Web, mobile and desktop products I've built end to end, plus my video editing work.">
    <meta property="og:image" content="https://v1.portfolio.himaiz.com/og-preview.png">
    <meta property="og:url" content="https://v1.portfolio.himaiz.com/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Maiz | Software developer</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
